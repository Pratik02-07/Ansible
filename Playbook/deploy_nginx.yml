---
- name: Configure Webserver and Deploy Nginx
  hosts: webservers
  become: yes  # Runs tasks with sudo privileges
  tasks:

    - name: Ensure apt cache is up to date
      apt:
        update_cache: yes

    - name: Install Nginx web server
      apt:
        name: nginx
        state: present

    - name: Start and enable Nginx service
      service:
        name: nginx
        state: started
        enabled: yes
