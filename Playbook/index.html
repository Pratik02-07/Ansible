<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to NGINX!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #009639; /* NGINX Green */
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #666;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #aaa;
        }
        a {
            color: #009639;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Pratikpatil.tech!</h1>
        <p>If you see this page, your NGINX web server is successfully installed and serving static HTML content.</p>
        <p>For online documentation and support, please refer to the official <a href="https://nginx.org/" target="_blank">nginx.org</a> website.</p>
        <div class="footer">
            <p>Managed via <em>/var/www/html/index.html</em></p>
        </div>
    </div>

</body>
</html>
